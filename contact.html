<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get Your Free Quote | Gemstate Customs</title>
  <meta name="description" content="Request a free, no-obligation quote from Gemstate Customs. Call (208) 569-3084 or send us your project details.">
  <link rel="icon" href="images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"></header>

  <section class="page-hero">
    <div class="bg" style="background-image:url('images/2209779864.jpg')"></div>
    <div class="wrap">
      <span class="eyebrow">Free Quote</span>
      <h1>Let's Get<br>Started</h1>
      <p>Tell us about your project and we'll get back to you fast. Free estimates, no obligation.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap contact-grid">
      <form class="form-card reveal" id="quote-form">
        <h2 style="font-size:2rem">Request your free quote</h2>
        <p style="color:#4b5563;margin-bottom:28px">Prefer to talk? Call <a href="tel:+12085693084" style="color:var(--gem);font-weight:800">(208) 569-3084</a>.</p>
        <div class="form-row">
          <div class="field"><label for="name">Full name</label><input id="name" name="name" required autocomplete="name"></div>
          <div class="field"><label for="phone">Phone</label><input id="phone" name="phone" type="tel" required autocomplete="tel"></div>
        </div>
        <div class="form-row">
          <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"></div>
          <div class="field"><label for="city">City</label><input id="city" name="city" placeholder="Idaho Falls"></div>
        </div>
        <div class="field">
          <label for="type">Project type</label>
          <select id="type" name="type">
            <option>Kitchen Remodel</option>
            <option>Bathroom Renovation</option>
            <option>Basement Finishing</option>
            <option>Interior / Full Home Remodel</option>
            <option>Custom Addition</option>
            <option>Custom Home</option>
            <option>Commercial Project</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field"><label for="details">Tell us about your project</label><textarea id="details" name="details" placeholder="What are you hoping to do? Any timeline or budget in mind?"></textarea></div>
        <button class="btn btn-gem" type="submit" style="width:100%">Send My Quote Request</button>
        <p id="form-note" style="margin:16px 0 0;color:var(--navy);font-weight:600"></p>
      </form>

      <aside class="info-card reveal">
        <div class="logo-chip"><img src="images/logo.png" alt="Gemstate Customs"></div>
        <div class="info-line"><span class="icon-gem"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span><div><small>Call or Text</small><a href="tel:+12085693084">(208) 569-3084</a></div></div>
        <div class="info-line"><span class="icon-gem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><div><small>Email</small><a href="mailto:gemstatecustom@gmail.com">gemstatecustom@gmail.com</a></div></div>
        <div class="info-line"><span class="icon-gem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg></span><div><small>Office</small><p>1846 1st St, Idaho Falls, ID 83401</p></div></div>
        <iframe class="map" title="Map to Gemstate Customs" loading="lazy" src="https://maps.google.com/maps?q=1846%201st%20St%2C%20Idaho%20Falls%2C%20ID%2083401&z=14&output=embed"></iframe>
      </aside>
    </div>
  </section>

  <footer class="site-footer"></footer>
  <script src="js/site.js"></script>
</body>
</html>
